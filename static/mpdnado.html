<!DOCTYPE html>
<html>

<head>
<title>MPD Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href={{ static_url("css/bootstrap.min.css") }} rel="stylesheet"/>
<script src={{ static_url("js/jquery.min.js") }}></script>
</head>

<body>
<div class="text-center">
<div class="container">
<button type="button" class="btn-lg btn-solid theme-info" id="btn_play">TOGGLE</button>
</div>
<div class="container">
  <div class="form-range">
  <input type="range" class="form-range-input theme-accent" id="volume">
  </div>
</div>
<div class="container">
  <div class="alert theme-secondary" role="alert">
  <p id="status">NO INFO</p>
  </div>
</div>
</div>

<script>
$('#btn_play').on('click', async function() {
  sendCommand("TOG");
});

$('#volume').on('change', function() {
  sendCommand("VOL", {"level":$(this).val()})
});

async function sendCommand(command, params=null) {
  resp = await $.ajax({
    url: "/",
    type: "POST",
    dataType: "json",
    data: JSON.stringify({
      CMD: command,
      PAR: params
    })
  })
  console.log(JSON.stringify(resp));
  $('#status').text(JSON.stringify(resp, null, 2));
}
</script>
</body>

</html>
